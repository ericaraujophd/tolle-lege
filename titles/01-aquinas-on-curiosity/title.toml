# Back cover
quote = "“Just as in respect of his corporeal nature man naturally desires the pleasures of food and sex, so, in respect of his soul, he naturally desires to know something.”"
quote_ref = "II-II, Question 166, Article 2"
blurb = "Two short questions from the _Summa Theologiae_ on the virtue that orders our desire to know, and the vice that scatters it."

