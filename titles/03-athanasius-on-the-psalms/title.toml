edition_note = "This is a new translation, made from the Greek text printed in Migne's Patrologia Graeca, vol. 27 (1857). Athanasius quotes the Psalms from the Greek Bible; the quotations are translated as he gives them. Psalm numbers follow English Bibles. In four places the printed Greek gives a psalm number that is plainly a copying slip (Ps. 105 for 15, Ps. 17 for 18, Ps. 41 for 47, and one unreadable number in the list of psalms of praise); the intended psalm is given, and the unreadable number is left out. The section headings are the editor's."
